<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Administrar Treinamentos · Sellmed Brasil</title>
<link rel="icon" href="assets/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0C2F79; --teal:#1EA4A8; --green:#73CC6E; --green-dk:#3E9A3A;
    --teal-soft:#EAF6F6; --navy-soft:#EDF1FA; --green-soft:#E9F7E8;
    --bg:#FAFBFB; --surface:#FFFFFF; --border:#E2E8EC; --hover:#F2F6F8;
    --ink:#1D2939; --text:#5B6772; --muted:#858683; --red:#B8372F; --red-bg:#FCEDEC; --amber:#9A6A12; --amber-bg:#FFF5E0;
    --grad:linear-gradient(90deg,#0C2F79 0%,#1EA4A8 50%,#73CC6E 100%);
    color-scheme:light;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);font-family:'Inter',Arial,sans-serif;color:var(--text);font-size:14px;}
  h1,h2,h3,h4{font-family:'Montserrat',Arial,sans-serif;}
  .hidden{display:none !important;}
  .accent-bar{height:5px;background:var(--grad);}
  header.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 32px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;}
  header.topbar img{height:46px;width:auto;display:block;}
  header.topbar h1{margin:0;font-size:19px;font-weight:800;color:var(--navy);}
  header.topbar p{margin:2px 0 0;font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.4px;text-transform:uppercase;}
  header.topbar .spacer{flex:1;}
  main{max-width:1180px;margin:0 auto;padding:22px 32px 70px;}

  .btn{border:1px solid transparent;border-radius:8px;padding:9px 15px;font-family:'Inter',sans-serif;font-weight:600;font-size:13.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;white-space:nowrap;background:none;}
  .btn:disabled{opacity:.55;cursor:wait;}
  .btn-primary{background:var(--navy);color:#fff;} .btn-primary:hover{filter:brightness(1.18);}
  .btn-teal{background:var(--teal);color:#fff;} .btn-teal:hover{filter:brightness(1.08);}
  .btn-ghost{background:var(--surface);color:var(--navy);border-color:var(--border);} .btn-ghost:hover{background:var(--hover);}
  .btn-danger{background:var(--surface);color:var(--red);border-color:#F0CFCC;} .btn-danger:hover{background:var(--red-bg);}
  .btn-sm{padding:5px 10px;font-size:12.5px;}
  .btn-ic{padding:5px 8px;}

  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:20px;}
  .tab{background:none;border:none;border-bottom:3px solid transparent;padding:10px 16px;font:700 13.5px 'Montserrat',sans-serif;color:var(--muted);cursor:pointer;margin-bottom:-1px;}
  .tab.on{color:var(--navy);border-bottom-color:var(--teal);}

  section.panel{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px 22px;margin-bottom:20px;}
  section.panel h2{margin:0 0 14px;font-size:14px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.5px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  section.panel h2::before{content:"";width:4px;height:15px;background:linear-gradient(var(--navy),var(--teal));border-radius:2px;}
  section.panel h2 .right{margin-left:auto;display:flex;gap:8px;text-transform:none;letter-spacing:0;flex-wrap:wrap;}

  .login{max-width:400px;margin:60px auto;}
  .login p{margin:-4px 0 16px;color:var(--muted);font-size:13.5px;}
  input[type=text],input[type=password],input[type=search],input[type=number],input[type=url],textarea,select{width:100%;border:1px solid var(--border);border-radius:8px;padding:9px 11px;font-size:14px;font-family:'Inter',sans-serif;color:var(--ink);background:var(--surface);}
  input:focus,textarea:focus,select:focus{outline:2px solid var(--teal);outline-offset:1px;}
  textarea{resize:vertical;min-height:70px;line-height:1.45;}
  label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;}
  label.f input,label.f textarea,label.f select{text-transform:none;letter-spacing:0;font-weight:400;}
  label.check{display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--ink);cursor:pointer;}
  label.check input{accent-color:var(--navy);width:16px;height:16px;}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px 16px;}
  .form-grid .full{grid-column:1/-1;}
  .hint{font-size:11.5px;font-weight:500;color:var(--muted);text-transform:none;letter-spacing:0;line-height:1.45;}

  .drop{display:block;border:2px dashed #C9E6E7;background:var(--teal-soft);border-radius:12px;padding:18px;text-align:center;cursor:pointer;color:var(--navy);font-weight:600;}
  .drop.over{border-color:var(--teal);background:#DDF0F0;}
  .drop small{display:block;font-weight:500;color:var(--muted);margin-top:4px;}
  .drop input{display:none;}
  .prog{height:6px;background:#EDF1F4;border-radius:4px;overflow:hidden;margin-top:10px;}
  .prog i{display:block;height:100%;width:0;background:var(--grad);transition:width .2s;}
  .seg{display:inline-flex;border:1px solid var(--border);border-radius:9px;padding:3px;gap:3px;background:var(--bg);}
  .seg button{border:none;background:none;padding:6px 12px;border-radius:6px;font:600 12.5px 'Inter',sans-serif;color:var(--muted);cursor:pointer;}
  .seg button.on{background:var(--surface);color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.08);}
  .cur{display:flex;gap:10px;align-items:center;background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:9px 12px;font-size:13px;color:var(--ink);margin-top:10px;word-break:break-all;}
  .cur a{color:var(--navy);font-weight:600;}

  .tbl-wrap{overflow-x:auto;}
  table.t{width:100%;border-collapse:collapse;font-size:13.5px;}
  table.t th{text-align:left;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;padding:9px 10px;border-bottom:1px solid var(--border);white-space:nowrap;}
  table.t td{padding:10px;border-bottom:1px solid #EEF2F4;color:var(--ink);vertical-align:middle;}
  table.t tr:hover td{background:#FAFCFD;}
  table.t td.acts{white-space:nowrap;text-align:right;}
  table.t .small{font-size:12px;color:var(--muted);}
  .tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:5px;background:var(--navy-soft);color:var(--navy);white-space:nowrap;}
  .tag.ok{background:var(--green-soft);color:var(--green-dk);} .tag.no{background:var(--red-bg);color:var(--red);} .tag.mid{background:var(--amber-bg);color:var(--amber);} .tag.off{background:#EEF0F2;color:var(--muted);}
  .empty{padding:30px;text-align:center;color:var(--muted);}
  .thumb{width:72px;height:40px;object-fit:cover;border-radius:5px;border:1px solid var(--border);display:block;background:linear-gradient(135deg,#0C2F79,#1EA4A8);}
  .ic{width:30px;height:30px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;background:var(--navy-soft);color:var(--navy);}
  .ic.quiz{background:var(--green-soft);color:var(--green-dk);} .ic.apresentacao{background:var(--teal-soft);color:#137A7D;}
  .bar{height:6px;border-radius:9px;background:#EDF1F4;overflow:hidden;min-width:80px;}
  .bar i{display:block;height:100%;background:var(--grad);}
  .barrow{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--navy);}

  .detail-head{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:16px;}
  .detail-head img,.detail-head .ph{width:150px;height:80px;border-radius:9px;object-fit:cover;border:1px solid var(--border);background:linear-gradient(135deg,#0C2F79,#1EA4A8);}
  .detail-head .txt{flex:1;min-width:220px;}
  .detail-head h3{margin:0;font-size:20px;color:var(--navy);}
  .detail-head p{margin:4px 0 0;font-size:13px;}
  .back{background:none;border:none;color:var(--teal);font:600 13px 'Inter',sans-serif;cursor:pointer;padding:0;margin-bottom:12px;}

  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px;}
  .kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;}
  .kpi b{display:block;font:800 24px 'Montserrat',sans-serif;color:var(--navy);}
  .kpi span{font-size:12px;font-weight:600;color:var(--muted);}
  .filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
  .filters input{flex:1;min-width:200px;} .filters select{width:auto;min-width:220px;}

  /* Quiz builder */
  .qb{display:flex;flex-direction:column;gap:12px;margin-top:6px;}
  .qcard{border:1px solid var(--border);border-radius:11px;padding:14px;background:var(--bg);}
  .qcard .qh{display:flex;gap:8px;align-items:center;margin-bottom:9px;}
  .qcard .qh b{font:700 12.5px 'Montserrat',sans-serif;color:var(--navy);flex:1;}
  .optrow{display:flex;gap:8px;align-items:center;margin-top:7px;}
  .optrow input[type=radio]{accent-color:var(--green-dk);width:17px;height:17px;flex:none;cursor:pointer;}
  .optrow .l{font:700 12.5px 'Montserrat',sans-serif;color:var(--navy);width:16px;flex:none;}
  .optrow input[type=text]{padding:7px 10px;font-size:13.5px;}
  .optrow.right input[type=text]{border-color:#9ED79A;background:var(--green-soft);}
  .xbtn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;padding:2px 6px;border-radius:6px;}
  .xbtn:hover{background:var(--red-bg);color:var(--red);}
  pre.fmt{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:12.5px;margin:8px 0;white-space:pre-wrap;color:var(--ink);}

  .overlay{position:fixed;inset:0;background:rgba(10,20,50,.45);display:none;align-items:flex-start;justify-content:center;padding:30px 20px;z-index:50;overflow:auto;}
  .overlay.open{display:flex;}
  .modal{background:var(--surface);border-radius:14px;width:100%;max-width:680px;box-shadow:0 20px 60px rgba(10,20,50,.3);margin:auto;}
  .modal.wide{max-width:860px;}
  .modal header{padding:16px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;}
  .modal header h3{margin:0;font-size:16px;color:var(--navy);flex:1;}
  .modal .body{padding:20px 22px;}
  .modal footer{padding:14px 22px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end;position:sticky;bottom:0;background:var(--surface);border-radius:0 0 14px 14px;}
  .x{background:none;border:none;font-size:22px;color:var(--muted);cursor:pointer;line-height:1;}
  .mtabs{display:flex;gap:4px;padding:0 22px;border-bottom:1px solid var(--border);overflow-x:auto;}
  .mtabs button{background:none;border:none;border-bottom:3px solid transparent;padding:12px 12px 10px;font:700 13px 'Montserrat',sans-serif;color:var(--muted);cursor:pointer;margin-bottom:-1px;display:flex;align-items:center;gap:7px;white-space:nowrap;}
  .mtabs button.on{color:var(--navy);border-bottom-color:var(--teal);}
  .mtabs .dot{width:20px;height:20px;border-radius:50%;background:#EEF0F2;color:var(--muted);font-size:11px;display:inline-flex;align-items:center;justify-content:center;}
  .mtabs button.on .dot{background:var(--navy);color:#fff;}
  .mtabs button.ok .dot{background:var(--green-dk);color:#fff;font-size:0;}
  .mtabs button.ok .dot::after{content:"✓";font-size:11px;}
  .modal{display:flex;flex-direction:column;max-height:calc(100vh - 60px);}
  .modal .body{min-height:0;overflow:auto;flex:1;}
  .modal header,.modal .mtabs,.modal footer{flex:none;}
  .module{padding:16px 20px;}
  .mod-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
  .mod-head h3{margin:0;font-size:16px;color:var(--navy);}
  .mod-head .right{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;}
  .mod-n{font:700 11px 'Montserrat',sans-serif;letter-spacing:.8px;text-transform:uppercase;color:#fff;background:var(--navy);border-radius:6px;padding:4px 9px;}
  .mod-desc{margin:-2px 0 10px;font-size:13px;}
  .mod-add{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px dashed var(--border);}
  .fl-items{display:flex;flex-direction:column;gap:8px;margin-top:10px;}
  .fl-row{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--border);border-radius:10px;padding:10px 12px;background:var(--surface);}
  .fl-row.erro{border-color:#EBB4AF;background:var(--red-bg);}
  .fl-row.ok:not(:has(.fl-url)){border-color:#BFE6BC;}
  .fl-main{flex:1;min-width:0;}
  .fl-main .fl-title{padding:6px 9px;font-size:13.5px;font-weight:600;}
  .fl-meta{font-size:12px;color:var(--muted);margin-top:5px;word-break:break-all;}
  .fl-row.ok .fl-meta b{color:var(--green-dk);} .fl-row.erro .fl-meta b{color:var(--red);}
  .fl-linkrow{display:flex;gap:8px;margin-top:6px;} .fl-linkrow select{width:auto;padding:6px 8px;font-size:13px;} .fl-linkrow input{padding:6px 9px;font-size:13px;}
  .fl-row .prog{margin-top:6px;}
  #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 18px;border-radius:9px;font-size:13.5px;font-weight:500;z-index:200;display:none;box-shadow:0 8px 24px rgba(0,0,0,.2);}
  #toast.err{background:var(--red);}
  @media (max-width:760px){ header.topbar,main{padding-left:16px;padding-right:16px;} .form-grid{grid-template-columns:1fr;} .kpis{grid-template-columns:1fr 1fr;} }
</style>
</head>
<body>
<div class="accent-bar"></div>
<header class="topbar">
  <img src="assets/logo.svg" alt="Sellmed Brasil">
  <div><h1>Administrar Treinamentos</h1><p>Painel restrito · Sellmed Brasil</p></div>
  <span class="spacer"></span>
  <a class="btn btn-ghost" href="./" target="_blank">Ver plataforma ↗</a>
  <button class="btn btn-ghost hidden" id="logout">Sair</button>
</header>

<main>
  <section class="panel login" id="loginBox">
    <h2>Entrar</h2>
    <p>Informe a senha de administrador para gerenciar treinamentos e ver os resultados.</p>
    <form id="loginForm">
      <input type="password" id="pw" placeholder="Senha" autocomplete="current-password" required aria-label="Senha">
      <div style="margin-top:14px;display:flex;justify-content:flex-end"><button class="btn btn-primary" id="loginBtn">Entrar</button></div>
    </form>
  </section>

  <div class="hidden" id="app">
    <nav class="tabs">
      <button class="tab on" data-tab="trein">Treinamentos</button>
      <button class="tab" data-tab="res">Resultados</button>
    </nav>
    <div id="tabTrein"></div>
    <div id="tabRes" class="hidden"></div>
  </div>
</main>

<div class="overlay" id="ov"><div class="modal" id="modal"></div></div>
<div id="toast" role="status"></div>

<script>
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = (s) => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const fmtDate = (iso) => iso ? new Date(iso).toLocaleDateString('pt-BR') : '';
const fmtDT = (iso) => iso ? new Date(iso).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit' }) : '';
const fmtSize = (b) => !b ? '' : b < 1048576 ? Math.max(1, Math.round(b / 1024)) + ' KB' : (b / 1048576).toFixed(1).replace('.', ',') + ' MB';
const SVG = (d, s = 16) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const I = {
  video: SVG('<polygon points="7 4 20 12 7 20 7 4"/>'),
  apresentacao: SVG('<rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/>'),
  quiz: SVG('<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17.5h.01"/>'),
  upload: SVG('<path d="M12 16V4m0 0-4.5 4.5M12 4l4.5 4.5M5 20h14"/>'),
  up: SVG('<path d="M12 19V5M6 11l6-6 6 6"/>', 14), down: SVG('<path d="M12 5v14M6 13l6 6 6-6"/>', 14),
};
const KIND = { video: 'Vídeo', apresentacao: 'Apresentação', quiz: 'Quiz' };
const LETTERS = 'ABCDEFGH';
const PW_KEY = 'trein.admin.pw';
const ss = { get: (k) => { try { return sessionStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { v == null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v); } catch {} } };

let PW = ss.get(PW_KEY) || '';
let TR = [];           // treinamentos com aulas
let OPEN = null;       // id do treinamento aberto
let RES = null;        // resultados

function toast(msg, err) { const t = $('#toast'); t.textContent = msg; t.className = err ? 'err' : ''; t.style.display = 'block'; clearTimeout(toast._t); toast._t = setTimeout(() => t.style.display = 'none', 3200); }

async function api(action, item) {
  const r = await fetch('/api/admin', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: PW, action, item }) });
  const d = await r.json().catch(() => ({}));
  if (r.status === 401) { logout(); throw new Error(d.error || 'Senha incorreta.'); }
  if (!r.ok) throw new Error(d.error || 'Falha na conexão.');
  if (d.treinamentos) TR = d.treinamentos;
  return d;
}

function showApp(on) {
  $('#loginBox').classList.toggle('hidden', on); $('#app').classList.toggle('hidden', !on); $('#logout').classList.toggle('hidden', !on);
  if (on) renderTrein();
}
function logout() { PW = ''; ss.set(PW_KEY, null); showApp(false); }
$('#logout').onclick = logout;
$('#loginForm').addEventListener('submit', async (e) => {
  e.preventDefault(); const b = $('#loginBtn'); b.disabled = true;
  PW = $('#pw').value;
  try { await api('login'); ss.set(PW_KEY, PW); $('#pw').value = ''; showApp(true); }
  catch (x) { toast(x.message, true); } finally { b.disabled = false; }
});

$$('.tab').forEach((t) => t.onclick = () => {
  $$('.tab').forEach((x) => x.classList.toggle('on', x === t));
  $('#tabTrein').classList.toggle('hidden', t.dataset.tab !== 'trein');
  $('#tabRes').classList.toggle('hidden', t.dataset.tab !== 'res');
  if (t.dataset.tab === 'res') loadRes();
});

/* ---------- Modal ---------- */
function openModal(html, wide) { const m = $('#modal'); m.className = 'modal' + (wide ? ' wide' : ''); m.innerHTML = html; $('#ov').classList.add('open'); $$('[data-close]', m).forEach((b) => b.onclick = closeModal); }
function closeModal() { if (UPLOADING > 0) return toast('Aguarde o envio terminar.', true); $('#ov').classList.remove('open'); }
$('#ov').addEventListener('mousedown', (e) => { if (e.target.id === 'ov') closeModal(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && $('#ov').classList.contains('open')) closeModal(); });

/* ---------- Upload ---------- */
let UPLOADING = 0; // quantos envios estão em andamento
const MIME = { mp4: 'video/mp4', webm: 'video/webm', mov: 'video/quicktime', pdf: 'application/pdf', pptx: 'application/vnd.openxmlformats-officedocument.presentationml.presentation', ppt: 'application/vnd.ms-powerpoint', jpg: 'image/jpeg' };
const VIDEO_EXT = ['mp4', 'webm', 'mov'], APRES_EXT = ['pptx', 'ppt', 'pdf'];
const extOf = (name) => String(name || '').toLowerCase().split('.').pop();
const kindOf = (name) => VIDEO_EXT.includes(extOf(name)) ? 'video' : APRES_EXT.includes(extOf(name)) ? 'apresentacao' : null;
const titleFromFile = (name) => name.replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' ').replace(/\s+/g, ' ').trim();
async function upload(file, type, name, bar) {
  const ext = extOf(name || file.name);
  const r = await fetch('/api/upload', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: PW, name: name || file.name, size: file.size, type }) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || 'Falha ao preparar o envio.');
  UPLOADING++;
  try {
    await new Promise((ok, fail) => {
      const x = new XMLHttpRequest();
      x.open('PUT', d.uploadUrl);
      x.setRequestHeader('Content-Type', MIME[ext] || 'application/octet-stream');
      x.upload.onprogress = (e) => { if (bar && e.lengthComputable) bar.style.width = Math.round((e.loaded / e.total) * 100) + '%'; };
      x.onload = () => x.status < 300 ? ok() : fail(new Error(`Falha no envio (${x.status}). ${(() => { try { return JSON.parse(x.responseText).message || ''; } catch { return ''; } })()}`));
      x.onerror = () => fail(new Error('Falha de conexão durante o envio.'));
      x.send(file);
    });
  } finally { UPLOADING--; }
  return d.url;
}

// Área de soltar arquivos; com multiple = true entrega todos os arquivos escolhidos
function dropzone(el, onFile, multiple = false) {
  const inp = $('input', el);
  if (multiple) inp.multiple = true;
  const take = (files) => { const list = [...files]; if (!list.length) return; multiple ? onFile(list) : onFile(list[0]); };
  inp.onchange = () => { take(inp.files); inp.value = ''; };
  el.addEventListener('dragover', (e) => { e.preventDefault(); el.classList.add('over'); });
  el.addEventListener('dragleave', () => el.classList.remove('over'));
  el.addEventListener('drop', (e) => { e.preventDefault(); el.classList.remove('over'); take(e.dataTransfer.files); });
}

const blankQ = () => ({ text: '', options: ['', '', '', ''], correct: null, explanation: '' });

function mediaPicker(root, kind, init = {}, { onUploaded, saveBtn } = {}) {
  let media = { url: init.mediaUrl || '', fileName: init.fileName || '', size: init.size || 0 };
  let mode = media.fileName ? 'file' : media.url ? 'link' : 'file';
  $('.m-url', root).value = media.fileName ? '' : media.url;
  const showCur = () => {
    $('.m-cur', root).innerHTML = media.fileName && media.url ? `<div class="cur">📎 <a href="${esc(media.url)}" target="_blank" rel="noopener">${esc(media.fileName)}</a> <span class="hint">${fmtSize(media.size)}</span>
      <button type="button" class="xbtn" data-mclear title="Remover arquivo" style="margin-left:auto">×</button></div>` : '';
    $('[data-mclear]', root)?.addEventListener('click', () => { media = { url: '', fileName: '', size: 0 }; showCur(); root.dispatchEvent(new Event('mediachange', { bubbles: true })); });
  };
  const setMode = (m) => {
    mode = m;
    $$('[data-mode]', root).forEach((b) => b.classList.toggle('on', b.dataset.mode === m));
    $('.m-file', root).classList.toggle('hidden', m !== 'file'); $('.m-link', root).classList.toggle('hidden', m !== 'link'); $('.m-cur', root).classList.toggle('hidden', m !== 'file');
    root.dispatchEvent(new Event('mediachange', { bubbles: true }));
  };
  $$('[data-mode]', root).forEach((b) => b.onclick = () => setMode(b.dataset.mode));
  $('.m-url', root).addEventListener('input', () => root.dispatchEvent(new Event('mediachange', { bubbles: true })));
  setMode(mode); showCur();
  dropzone($('.drop', root), async (file) => {
    const bar = $('.prog', root); bar.classList.remove('hidden'); $('i', bar).style.width = '0';
    const btn = saveBtn && $(saveBtn); if (btn) btn.disabled = true;
    try {
      const url = await upload(file, kind, file.name, $('i', bar));
      media = { url, fileName: file.name, size: file.size }; showCur();
      onUploaded?.(file); toast('Arquivo enviado');
      root.dispatchEvent(new Event('mediachange', { bubbles: true }));
    } catch (x) { toast(x.message, true); } finally { bar.classList.add('hidden'); if (btn) btn.disabled = false; }
  });
  return {
    // o que vai para o servidor; vazio se nada foi escolhido
    get: () => mode === 'file' ? (media.fileName ? { mediaUrl: media.url, fileName: media.fileName, size: media.size } : { mediaUrl: '' })
      : { mediaUrl: $('.m-url', root).value.trim(), fileName: '', size: 0 },
    filled() { return !!this.get().mediaUrl; },
  };
}

function quizBuilderHtml() {
  return `<div class="qbw"><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><span style="font:700 12px 'Montserrat';color:var(--muted);text-transform:uppercase;flex:1">Perguntas <span class="hint">· marque o círculo da alternativa correta</span></span>
      <button type="button" class="btn btn-ghost btn-sm" data-qimport>Importar de texto</button></div>
    <div class="qb"></div>
    <button type="button" class="btn btn-ghost" data-qadd style="margin-top:12px">+ Adicionar pergunta</button></div>`;
}
function quizBuilder(root, questions, { onChange } = {}) {
  const quiz = { questions: JSON.parse(JSON.stringify(questions || [])) };
  const uid = ++UID;
  const qb = $('.qb', root);
  const render = () => {
    qb.innerHTML = quiz.questions.map((q, qi) => `<div class="qcard" data-q="${qi}">
      <div class="qh"><b>Pergunta ${qi + 1}</b>
        <button type="button" class="btn btn-ghost btn-sm btn-ic" data-qmove="-1" ${qi === 0 ? 'disabled' : ''} title="Subir">${I.up}</button>
        <button type="button" class="btn btn-ghost btn-sm btn-ic" data-qmove="1" ${qi === quiz.questions.length - 1 ? 'disabled' : ''} title="Descer">${I.down}</button>
        <button type="button" class="xbtn" data-qdel title="Remover pergunta">×</button></div>
      <textarea class="qtext" rows="2" style="min-height:44px" placeholder="Enunciado da pergunta">${esc(q.text)}</textarea>
      ${q.options.map((o, oi) => `<div class="optrow ${q.correct === oi ? 'right' : ''}">
        <input type="radio" name="c${uid}-${qi}" value="${oi}" ${q.correct === oi ? 'checked' : ''} title="Alternativa correta">
        <span class="l">${LETTERS[oi]}</span><input type="text" class="otext" value="${esc(o)}" placeholder="Alternativa ${LETTERS[oi]}">
        <button type="button" class="xbtn" data-odel="${oi}" title="Remover alternativa" ${q.options.length <= 2 ? 'disabled style="visibility:hidden"' : ''}>×</button></div>`).join('')}
      ${q.options.length < 8 ? '<div style="margin-top:9px"><button type="button" class="btn btn-ghost btn-sm" data-oadd>+ Alternativa</button></div>' : ''}
      <input type="text" class="qexp" style="margin-top:9px;font-size:13px" value="${esc(q.explanation)}" placeholder="Explicação mostrada após responder (opcional)">
    </div>`).join('') || '<div class="empty" style="padding:16px">Nenhuma pergunta.</div>';
    onChange?.();
  };
  const sync = () => {
    $$('.qcard', qb).forEach((c) => {
      const q = quiz.questions[+c.dataset.q];
      q.text = $('.qtext', c).value; q.explanation = $('.qexp', c).value;
      q.options = $$('.otext', c).map((i) => i.value);
      const r = $('input[type=radio]:checked', c); q.correct = r ? +r.value : null;
    });
  };
  qb.onchange = (e) => { if (e.target.type === 'radio') { sync(); render(); } };
  qb.onclick = (e) => {
    const card = e.target.closest('.qcard'), t = e.target.closest('button'); if (!card || !t) return;
    const qi = +card.dataset.q; sync();
    const q = quiz.questions[qi];
    if (t.dataset.qdel != null) quiz.questions.splice(qi, 1);
    else if (t.dataset.qmove) { const j = qi + +t.dataset.qmove; [quiz.questions[qi], quiz.questions[j]] = [quiz.questions[j], quiz.questions[qi]]; }
    else if (t.dataset.oadd != null) q.options.push('');
    else if (t.dataset.odel != null) { const oi = +t.dataset.odel; q.options.splice(oi, 1); if (q.correct === oi) q.correct = null; else if (q.correct > oi) q.correct--; }
    else return;
    render();
  };
  $('[data-qadd]', root).onclick = () => { sync(); quiz.questions.push(blankQ()); render(); $$('.qcard', qb).pop().querySelector('textarea').focus(); };
  $('[data-qimport]', root).onclick = () => importQuiz((parsed, replace) => {
    sync();
    const isBlank = (q) => !q.text.trim() && q.options.every((o) => !o.trim());
    if (replace) quiz.questions.length = 0;
    else quiz.questions = quiz.questions.filter((q) => !isBlank(q)); // as perguntas vazias de modelo dão lugar às importadas
    parsed.forEach((q) => { while (q.options.length < 2) q.options.push(''); quiz.questions.push({ ...q, options: q.options.slice(0, 8) }); });
    render();
  });
  render();
  return {
    // perguntas totalmente em branco são ignoradas
    get() { sync(); return quiz.questions.filter((q) => q.text.trim() || q.options.some((o) => o.trim())); },
  };
}

        <input type="text" class="fl-title" value="${esc(it.title)}" maxlength="140" placeholder="Título da aula">
        ${it.link ? `<div class="fl-linkrow">${only ? '' : `<select class="fl-kind"><option value="video" ${it.kind === 'video' ? 'selected' : ''}>Vídeo</option><option value="apresentacao" ${it.kind === 'apresentacao' ? 'selected' : ''}>Apresentação</option></select>`}
            <input type="url" class="fl-url" value="${esc(it.mediaUrl)}" placeholder="https://…"></div>`
          : `<div class="fl-meta">${esc(it.fileName)} · ${fmtSize(it.size)} · <b>${it.state === 'ok' ? 'enviado ✓' : it.state === 'enviando' ? 'enviando…' : it.state === 'erro' ? 'erro: ' + esc(it.error) : 'na fila'}</b></div>
            ${it.state === 'enviando' || it.state === 'fila' ? `<div class="prog"><i style="width:${it.pct || 0}%"></i></div>` : ''}`}
      </div>
      ${it.state === 'enviando' ? '' : '<button type="button" class="xbtn fl-del" title="Remover">×</button>'}
    </div>`).join('');
  };
  box.addEventListener('input', (e) => {
    const row = e.target.closest('.fl-row'); if (!row) return;
    const it = items[+row.dataset.i];
    if (e.target.classList.contains('fl-title')) it.title = e.target.value;
    if (e.target.classList.contains('fl-url')) { it.mediaUrl = e.target.value.trim(); onChange?.(); }
  });
  box.addEventListener('change', (e) => { if (e.target.classList.contains('fl-kind')) { items[+e.target.closest('.fl-row').dataset.i].kind = e.target.value; changed(); } });
  box.addEventListener('click', (e) => { const b = e.target.closest('.fl-del'); if (b) { items.splice(+b.closest('.fl-row').dataset.i, 1); changed(); } });
  $('.fl-link', root).onclick = () => { items.push({ kind: only || 'video', title: '', mediaUrl: '', link: true, state: 'ok' }); changed(); $$('.fl-url', box).pop()?.focus(); };
  // envia um arquivo por vez, na ordem escolhida
  const pump = async () => {
    if (running) return; running = true;
    for (let it; (it = items.find((x) => x.state === 'fila'));) {
      it.state = 'enviando'; render();
      const row = () => box.querySelector(`.fl-row[data-i="${items.indexOf(it)}"] .prog i`);
      try {
        it.mediaUrl = await upload(it.file, it.kind, it.file.name, progressSink((w) => { it.pct = parseInt(w); const r = row(); if (r) r.style.width = w; }));
        it.state = 'ok';
      } catch (x) { it.state = 'erro'; it.error = x.message; }
      changed();
    }
    running = false;
  };
  dropzone($('.drop', root), (files) => {
    const bad = [];
    files.forEach((f) => {
      const k = kindOf(f.name);
      if (!k || (only && k !== only)) return bad.push(f.name);
      items.push({ kind: k, title: titleFromFile(f.name), file: f, fileName: f.name, size: f.size, state: 'fila' });
    });
    if (bad.length) toast(`Formato não aceito: ${bad.join(', ')}`, true);
    changed(); pump();
  }, true);
  return {
    busy: () => items.some((x) => x.state === 'fila' || x.state === 'enviando'),
    failed: () => items.filter((x) => x.state === 'erro').length,
    // aulas prontas para salvar (arquivos enviados + links preenchidos)
    lessons: () => items.filter((x) => x.state === 'ok' && x.mediaUrl).map((x) => ({
      kind: x.kind, title: x.title.trim() || (x.fileName ? titleFromFile(x.fileName) : KIND[x.kind]), mediaUrl: x.mediaUrl,
      fileName: x.link ? '' : x.fileName, size: x.link ? 0 : x.size,
    })),
  };
}
// o objeto passado como "bar" em upload() só precisa de style.width; este adaptador repassa o progresso
// (upload() faz bar.style.width = '42%')
function progressSink(set) { return { style: { set width(w) { set(w); } } }; }

// Perguntas do montador → formato do servidor (descarta alternativas vazias mantendo a correta no lugar)
function prepQuestions(questions) {
  const bad = questions.findIndex((q) => !q.text.trim() || q.options.filter((o) => o.trim()).length < 2 || q.correct == null || !q.options[q.correct]?.trim());
  if (bad >= 0) throw new Error(`Quiz, pergunta ${bad + 1}: preencha o enunciado, pelo menos 2 alternativas e marque a correta.`);
  return questions.map((q) => {
    const keep = q.options.map((o, i) => [o.trim(), i]).filter(([o]) => o);
    return { text: q.text, explanation: q.explanation, options: keep.map(([o]) => o), correct: keep.findIndex(([, i]) => i === q.correct) };
  });
}

// Formato: "1. Pergunta" / "a) alternativa" / "*b) correta" / "> explicação"
function parseQuizText(txt) {
  const out = []; let cur = null;
  txt.split(/\r?\n/).forEach((raw) => {
    const line = raw.trim(); if (!line) return;
    let m;
    if ((m = line.match(/^(\*?)\s*([a-h])[\)\.\-]\s*(.+)$/i)) && cur) {
      if (m[1] || /\s*\(correta\)\s*$/i.test(m[3])) cur.correct = cur.options.length;
      cur.options.push(m[3].replace(/\s*\(correta\)\s*$/i, '').trim());
    } else if ((m = line.match(/^>\s*(.+)$/)) && cur) cur.explanation = (cur.explanation ? cur.explanation + ' ' : '') + m[1];
    else if ((m = line.match(/^(?:\d+\s*[\)\.\-]|P\d*[:.)]?|Q\d*[:.)]?)\s*(.+)$/i)) || !cur || cur.options.length) {
      cur = { text: (m ? m[1] : line).trim(), options: [], correct: null, explanation: '' }; out.push(cur);
    } else cur.text += ' ' + line;
  });
  return out;
}

  const body = [cols.map((c) => c[0]).join(';'), ...rows.map((r) => cols.map((c) => cell(c[1](r))).join(';'))].join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + body], { type: 'text/csv;charset=utf-8' }));

}

    <div class="filters">
      <input type="search" id="rq" placeholder="Buscar participante por nome ou e-mail…" value="${esc(RF.q)}">
      <select id="rt"><option value="">Todos os treinamentos</option>${names.map((n) => `<option ${RF.t === n ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select>
      <button class="btn btn-ghost" id="rReload">Atualizar</button>
    </div>
    <div class="kpis">
      <div class="kpi"><b>${RF.t ? new Set(pr.map((r) => r.participanteId)).size : pp.length}</b><span>Participantes${RF.t ? ' neste treinamento' : ''}</span></div>
      <div class="kpi"><b>${done}</b><span>Treinamentos concluídos</span></div>
      <div class="kpi"><b>${tt.length}</b><span>Tentativas de quiz</span></div>
      <div class="kpi"><b>${avg}%</b><span>Nota média · ${passRate}% de aprovação</span></div>
    </div>
    <section class="panel"><h2>Progresso por treinamento <span class="right"><button class="btn btn-ghost btn-sm" id="cP">Exportar CSV</button></span></h2>
      ${!pr.length ? '<div class="empty">Nenhum progresso registrado ainda.</div>' : `<div class="tbl-wrap"><table class="t">
      <thead><tr><th>Participante</th><th>Treinamento</th><th>Progresso</th><th>Status</th><th>Última conclusão</th></tr></thead>
      <tbody>${pr.map((r) => `<tr><td><b>${esc(r.name)}</b><div class="small">${esc(r.email)}</div></td><td>${esc(r.treinamento)}</td>
        <td><div class="barrow"><div class="bar"><i style="width:${Math.round((r.concluidas / r.total) * 100)}%"></i></div>${r.concluidas}/${r.total}</div></td>
        <td>${r.concluidas === r.total ? '<span class="tag ok">Concluído</span>' : '<span class="tag mid">Em andamento</span>'}</td>
        <td class="small">${fmtDT(r.ultimaConclusao)}</td></tr>`).join('')}</tbody></table></div>`}
    </section>
    <section class="panel"><h2>Tentativas dos quizzes <span class="right"><button class="btn btn-ghost btn-sm" id="cT">Exportar CSV</button></span></h2>
      ${!tt.length ? '<div class="empty">Nenhum quiz respondido ainda.</div>' : `<div class="tbl-wrap"><table class="t">
      <thead><tr><th>Data</th><th>Participante</th><th>Treinamento · Quiz</th><th>Nota</th><th>Acertos</th><th>Resultado</th></tr></thead>
      <tbody>${tt.slice(0, 500).map((x) => `<tr><td class="small" style="white-space:nowrap">${fmtDT(x.createdAt)}</td><td><b>${esc(x.name)}</b><div class="small">${esc(x.email)}</div></td>
        <td>${esc(x.treinamento)}<div class="small">${esc(x.quiz)}</div></td><td><b style="color:var(--navy)">${x.score}%</b></td><td class="small">${x.correct}/${x.total}</td>
        <td>${x.passed ? '<span class="tag ok">Aprovado</span>' : '<span class="tag no">Reprovado</span>'}</td></tr>`).join('')}</tbody></table>
        ${tt.length > 500 ? `<div class="hint" style="margin-top:8px">Mostrando as 500 mais recentes de ${tt.length}. O CSV traz todas.</div>` : ''}</div>`}
    </section>
    ${RF.t ? '' : `<section class="panel"><h2>Participantes <span class="right"><button class="btn btn-teal btn-sm" id="inv">+ Convidar por e-mail</button><button class="btn btn-ghost btn-sm" id="cU">Exportar CSV</button></span></h2>
      ${!pp.length ? '<div class="empty">Ninguém cadastrado ainda. As pessoas entram em "Primeiro acesso" na plataforma, ou você pode convidá-las por e-mail.</div>' : `<div class="tbl-wrap"><table class="t">
      <thead><tr><th>Nome</th><th>E-mail</th><th>Acesso</th><th>Aulas concluídas</th><th>Tentativas</th><th>Último acesso</th><th></th></tr></thead>
      <tbody>${pp.map((p) => `<tr><td><b>${esc(p.name)}</b></td><td class="small">${esc(p.email)}</td>
        <td>${p.senhaEm ? '<span class="tag ok">Senha criada</span>' : '<span class="tag mid">Aguardando senha</span>'}</td><td>${p.concluidas}</td><td>${p.tentativas}</td>
        <td class="small">${p.senhaEm ? fmtDT(p.lastSeen) : '—'}</td><td class="acts">
        <button class="btn btn-ghost btn-sm" data-resend="${p.id}" title="Envia um novo link para ${p.senhaEm ? 'redefinir' : 'criar'} a senha">${p.senhaEm ? 'Redefinir senha' : 'Reenviar link'}</button>
        <button class="btn btn-danger btn-sm" data-delP="${p.id}">Remover</button></td></tr>`).join('')}</tbody></table></div>`}
    </section>`}`;
  const rq = $('#rq');
  rq.oninput = () => { RF.q = rq.value; const pos = rq.selectionStart; renderRes(); const n = $('#rq'); n.focus(); n.setSelectionRange(pos, pos); };
  $('#rt').onchange = (e) => { RF.t = e.target.value; renderRes(); };
  $('#rReload').onclick = loadRes;
  $('#inv')?.addEventListener('click', inviteModal);
  $('#cP')?.addEventListener('click', () => csv(pr, [['Nome', (r) => r.name], ['E-mail', (r) => r.email], ['Treinamento', (r) => r.treinamento],
    ['Aulas concluídas', (r) => r.concluidas], ['Total de aulas', (r) => r.total], ['Status', (r) => r.concluidas === r.total ? 'Concluído' : 'Em andamento'], ['Última conclusão', (r) => fmtDT(r.ultimaConclusao)]], 'progresso-treinamentos'));
  $('#cT')?.addEventListener('click', () => csv(tt, [['Data', (x) => fmtDT(x.createdAt)], ['Nome', (x) => x.name], ['E-mail', (x) => x.email], ['Treinamento', (x) => x.treinamento],
    ['Quiz', (x) => x.quiz], ['Nota (%)', (x) => x.score], ['Acertos', (x) => x.correct], ['Perguntas', (x) => x.total], ['Resultado', (x) => x.passed ? 'Aprovado' : 'Reprovado']], 'tentativas-quizzes'));
  $('#cU')?.addEventListener('click', () => csv(pp, [['Nome', (p) => p.name], ['E-mail', (p) => p.email], ['Acesso', (p) => p.senhaEm ? 'Senha criada' : 'Aguardando senha'], ['Aulas concluídas', (p) => p.concluidas],
    ['Tentativas', (p) => p.tentativas], ['Primeiro acesso', (p) => fmtDT(p.createdAt)], ['Último acesso', (p) => fmtDT(p.lastSeen)]], 'participantes'));
}

if (PW) api('login').then(() => showApp(true)).catch(() => showApp(false));
</script>
</body>
</html>
